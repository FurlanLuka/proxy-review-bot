name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check and test
        working-directory: service
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Test
        working-directory: app
        run: swift test

      - name: Build the app bundle
        working-directory: app
        run: scripts/build-app.sh

      - name: Smoke-test the bundled service
        run: sh scripts/smoke-service-binary.sh app/build/ProxyReviewBot.app/Contents/MacOS/proxy-review-bot-service

      - name: Check the installer
        run: |
          sh -n install.sh
          sh tests/install-parsing.sh
